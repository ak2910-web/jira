const students = [
  { name: "Asha", marks: [80, 72, 91] },
  { name: "Ravi", marks: [55, 61, 48] },
  { name: "Mina", marks: [32, 45, 39] }
];

const sum = (numbers) => numbers.reduce((total, value) => total + value, 0);
const average = (numbers) => sum(numbers) / numbers.length;
const result = (student) => ({
  ...student,
  average: average(student.marks),
  passed: average(student.marks) >= 40
});

const evaluated = students.map(result);
const passed = evaluated.filter((student) => student.passed);
const classTotal = evaluated.reduce((total, student) => total + student.average, 0);

console.log("Values:", Object.values(evaluated[0]));
console.table(evaluated);
console.log("Passed students:", passed.map((student) => student.name));
console.log("Class average:", classTotal / evaluated.length);`},

import { useState } from "react";

function Profile({ name, role }) {
  return <p><strong>{name}</strong> — {role}</p>;
}

export default function App() {
  const [count, setCount] = useState(0);
  const [task, setTask] = useState("");
  const [tasks, setTasks] = useState(["Learn props"]);

  function addTask(event) {
    event.preventDefault();
    if (!task.trim()) return;
    setTasks((current) => [...current, task.trim()]);
    setTask("");
  }

  return (
    <main>
      <h1>Interactive React Components</h1>
      <Profile name="Asha" role="MERN learner" />
      <button onClick={() => setCount((value) => value + 1)}>Count: {count}</button>
      <form onSubmit={addTask}>
        <input value={task} onChange={(event) => setTask(event.target.value)} placeholder="New task" />
        <button type="submit">Add</button>
      </form>
      <ul>{tasks.map((item, index) => <li key={item + index}>{item}</li>)}</ul>
    </main>
  );
}`},

    <ul>{items.map((item) => <li key={item._id}>{item.name} — {item.email} ({item.course})
      <button onClick={() => { setEdit(item._id); setForm(item); }}>Edit</button>
      <button onClick={async () => { await api.delete("/students/" + item._id); load(); }}>Delete</button></li>)}</ul>
  </main>;
}`},
];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const cards=[["AEB-1","Create a user registration and login system","Backlog"],["AEB-5","Create Dashboard","Backlog"],["AEB-6","Create User Profile","Backlog"],["AEB-2","Developed Login API","In Progress"],["AEB-3","Login Functionality","In Review"],["AEB-4","Database Setup Completed","In Review"]];
const cols=["Backlog","Selected for development","In Progress","In Review","Done"];
let tab="board",cur=0;
function render(){
 document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t==tab));
 const v=document.getElementById("v");
 if(tab=="board")v.innerHTML='<div class="board">'+cols.map(c=>'<div class="col"><h5>'+c.toUpperCase()+'</h5>'+cards.filter(k=>k[2]==c).map(k=>'<div class="card">'+k[1]+'<br><small>☑ '+k[0]+'</small></div>').join("")+'</div>').join("")+'</div>';
 else if(tab=="sum")v.innerHTML='<div class="stats"><div class="stat"><b>6</b>work items created</div><div class="stat"><b>1</b>in progress</div><div class="stat"><b>2</b>in review</div><div class="stat"><b>0</b>due this week</div></div>';
 else if(tab=="list")v.innerHTML='<table><tr><th>Key</th><th>Work</th><th>Status</th><th>Priority</th></tr>'+cards.map(k=>'<tr><td>'+k[0]+'</td><td>'+k[1]+'</td><td><span class="tag">'+k[2].toUpperCase()+'</span></td><td>'+(k[0]=="AEB-1"?"High":"Medium")+'</td></tr>').join("")+'</table>';
 else if(tab=="cal")v.innerHTML='<p style="color:var(--m)">No work items scheduled this month.</p>';
 else docs();
}
function docs(){
 const all=[];
 let toc='<h6>MERN Stack Practicals</h6>';
 S.forEach((x,pi)=>{
  x.questions.forEach((question,qi)=>{
   all.push({practical:x,question});
   const i=all.length-1;
   toc+='<a data-i="'+i+'" class="question '+(i==cur?"on":"")+'">Practical '+(pi+1)+'.'+String.fromCharCode(97+qi)+': '+esc(question.title)+'</a>';
  });
 });
 const o=all[cur]||all[0];
 let body='<h2>'+esc(o.practical.title)+'</h2><p style="color:var(--m)"><strong>Aim:</strong> '+esc(o.practical.aim)+'</p>';
 body+=o.practical.questions.map((question,index)=>
  '<section><h3>Question '+String.fromCharCode(97+index)+': '+esc(question.title)+'</h3><p class="answer">'+esc(question.answer)+'</p></section>'
 ).join("");
 body+='<section class="practical-code"><h3>Complete practical code</h3><p>Save the snippets using the file names shown in the comments, install the packages mentioned above, and run the relevant command for the project type.</p><pre>'+esc(o.practical.code)+'</pre></section>';
 document.getElementById("v").innerHTML='<div class="docs"><div class="toc">'+toc+'</div><div class="doc">'+body+'</div></div>';
 document.querySelectorAll(".toc a").forEach(a=>a.onclick=()=>{cur=+a.dataset.i;docs();scrollTo(0,0)});
}
document.querySelectorAll("#tabs a").forEach(a=>a.onclick=()=>{tab=a.dataset.t;render()});
render();
</script></body></html>
