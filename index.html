<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Education Bot – Jira</title>
<style>
:root{--bg:#fff;--s:#f4f5f7;--t:#172b4d;--m:#5e6c84;--b:#dfe1e6;--p:#0c66e4;--cd:#fff;--code:#091e42;--cf:#e9f2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2125;--s:#22272b;--t:#c7d1db;--m:#8c9bab;--b:#38414a;--p:#579dff;--cd:#2c333a;--code:#0d1117;--cf:#1c2b41}}
:root[data-theme="dark"]{--bg:#1d2125;--s:#22272b;--t:#c7d1db;--m:#8c9bab;--b:#38414a;--p:#579dff;--cd:#2c333a;--code:#0d1117;--cf:#1c2b41}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--b);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:700;color:var(--p);font-size:16px}
.top input{flex:1;max-width:420px;padding:6px 10px;border:1px solid var(--b);border-radius:4px;background:var(--bg);color:var(--t)}
.btn{background:var(--p);color:#fff;border:0;border-radius:4px;padding:6px 12px;font-weight:600;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;background:#172b4d;color:#fff;display:grid;place-items:center;font-size:11px;margin-left:auto}
.wrap{display:flex;min-height:calc(100vh - 50px)}
.side{width:200px;border-right:1px solid var(--b);padding:12px 8px;background:var(--bg);flex:none}
.side div{padding:6px 10px;border-radius:4px;color:var(--m)}.side .on{background:var(--cf);color:var(--p);font-weight:600}
.side h6{margin:14px 10px 4px;font-size:11px;color:var(--m);text-transform:uppercase}
main{flex:1;min-width:0;padding:16px 24px}
.bc{color:var(--m);font-size:12px}h1{font-size:22px;margin:4px 0 10px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--b);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:8px 12px;cursor:pointer;color:var(--m);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--p);border-color:var(--p)}
.board{display:flex;gap:8px;overflow-x:auto}
.col{background:var(--s);border-radius:4px;min-width:200px;flex:1;padding:8px}
.col h5{margin:0 0 8px;font-size:11px;color:var(--m)}
.card{background:var(--cd);border-radius:3px;padding:8px;margin-bottom:6px;box-shadow:0 1px 1px rgba(9,30,66,.25)}
.card small{color:var(--m)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--b);border-radius:6px;padding:12px}.stat b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--b)}
.tag{background:var(--cf);color:var(--p);border-radius:3px;padding:1px 6px;font-size:11px;font-weight:600}
.docs{display:flex;gap:16px}.toc{width:230px;flex:none;max-height:75vh;overflow:auto;border-right:1px solid var(--b);padding-right:8px}
.toc h6{margin:10px 0 4px;color:var(--m);font-size:11px;text-transform:uppercase}
.toc a{display:block;padding:4px 8px;border-radius:4px;cursor:pointer;color:var(--t)}.toc a.question{padding-left:16px;font-size:13px}.toc a.on{background:var(--cf);color:var(--p)}
.doc{flex:1;min-width:0}.doc h2{margin:0 0 4px}
pre{background:var(--code);color:#e6edf3;padding:12px;border-radius:6px;overflow-x:auto;font-size:12.5px;line-height:1.45}
.out{border-left:3px solid var(--p);padding:6px 10px;background:var(--s);white-space:pre-wrap;font-family:monospace;font-size:12.5px}
ol{padding-left:20px}
@media(max-width:760px){.side{display:none}main{padding:12px}.docs{flex-direction:column}.toc{width:auto;max-height:160px;border:0}}
</style></head><body>
<div class="top"><span class="logo">◆ Jira</span><input placeholder="Search"><button class="btn">+ Create</button><div class="av">AP</div></div>
<div class="wrap">
<div class="side"><div>For you</div><div>Recent</div><div>Starred</div><h6>Spaces</h6><div class="on">AI Education Bot</div><div>Online Shopping Site</div><div>E-Learning Mgmt</div><h6>More</h6><div>Filters</div><div>Dashboards</div></div>
<main>
<div class="bc">Spaces / AI Education Bot</div><h1>AEB board</h1>
<div class="tabs" id="tabs"><a data-t="sum">Summary</a><a data-t="board" class="on">Kanban board</a><a data-t="list">List</a><a data-t="cal">Calendar</a><a data-t="docs">Docs</a></div>
<div id="v"></div>
</main></div>
<script>
const S=[
["Practical 1 – Environmental Setup and JavaScript Basics","Install tools and run basic JavaScript programs in Node.js.",[

"Q(e) Demonstrate operators and control statements in JavaScript.\nA: Show relational/logical operators and conditional flow using `if-else` and `switch`.",
"Q(f) Write a program using loops and template literals.\nA: Use `for`/`while` loops and backtick strings like `` `Value is ${x}` `` for dynamic output."
]],
["Practical 2 – Core JavaScript Concepts for MERN","Implement core JavaScript function, array, and object operations.",[
"Q(a) Create functions and call with parameters.\nA: Write reusable functions such as odd/even check, sum function, and pass input arguments at call time.",
"Q(b) Work with arrays and objects.\nA: Create arrays/objects, read/update values, and iterate through entries using loops.",
"Q(c) Demonstrate arrow functions.\nA: Use concise syntax like `const add=(a,b)=>a+b` and call it for output.",

"Q(e) Manipulate objects and display outputs.\nA: Add/edit/delete object properties and print keys/values with `Object.keys` and loops.",

]],
["Practical 3 – React Introduction and JSX","Create a React app and render dynamic JSX content.",[
"Q(a) Create a React app (Vite/CRA) and display welcome message.\nA: Create app using Vite (`npm create vite@latest`) or CRA, then render “Welcome to MERN Stack Development”.",
"Q(b) Display dynamic data using JSX.\nA: Bind JavaScript variables/expressions inside JSX using `{}` syntax.",
"Q(c) Declare variables and function to calculate sum of two numbers.\nA: Define two variables, call a sum function, and render result in JSX.",
"Q(d) Apply basic CSS styling to a React component.\nA: Create CSS file, import into component, and style text/cards/buttons.",
"Q(e) Create a functional component and render in `App.jsx`.\nA: Define component function and include `<ComponentName />` in App return block.",

]],
["Practical 4 – React Components, Props, and State","Build interactive components using props and state.",[
"Q(a) Create multiple components on one page.\nA: Split UI into reusable components and import/render all in `App.jsx`.",
"Q(b) Pass data between components using props.\nA: Send values from parent to child via attributes and display with `props`.",
"Q(c) Use `useState` to manage and update data.\nA: Initialize state and update with setter function on button/form events.",
"Q(d) Display list items from state using `map()`.\nA: Store array in state and render list with unique `key` for each item.",
"Q(e) Create a form component and show entered data dynamically.\nA: Capture input values with controlled components and render current values below form.",
"Q(f) Build a small interactive component (Counter or ToDo).\nA: Implement increment/decrement logic or add/remove task flow with state updates."
]],
["Practical 5 – React Routing and Data Handling","Use routing and API calls in a React app.",[
"Q(a) Install and configure React Router.\nA: Install `react-router-dom`, wrap app with router, and define routes.",
"Q(b) Create multiple pages and navigation.\nA: Create page components and navigate between them via links/menu.",
"Q(c) Use `Link` and `Routes`.\nA: Define `<Routes><Route ... /></Routes>` and navigate with `<Link to=\"/...\">`.",
"Q(d) Fetch data from public API using Axios.\nA: Install Axios and call API in `useEffect`; store response in state.",
"Q(e) Display fetched data in table/list.\nA: Map response array to rows/cards with clear headings and fields.",
"Q(f) Implement search/filter on displayed data.\nA: Maintain query state and filter API data before rendering."
]],
["Practical 6 – Node.js and Express Fundamentals","Create backend server and route handlers with Express.",[
"Q(a) Install Express and create a server.\nA: Run `npm init -y`, `npm install express`, then create `server.js` with `app.listen(...)`.",
"Q(b) Create multiple routes in Express.\nA: Add routes like `/`, `/about`, `/api/users` using `app.get()`.",
"Q(c) Send HTML content from Express server.\nA: Return HTML strings or files using `res.send()`/`res.sendFile()`.",
"Q(d) Handle route parameters.\nA: Use dynamic path params like `/user/:id` and access via `req.params.id`.",
"Q(e) Handle query parameters.\nA: Read values from `req.query` (for example `/search?q=mern`).",
"Q(f) Create a simple JSON API.\nA: Return structured JSON arrays/objects with `res.json()`."
]],
["Practical 7 – MongoDB Community Server and Compass","Set up MongoDB and connect it to Node.js.",[
"Q(a) Download and install MongoDB Community Server.\nA: Install MongoDB server and confirm service is running locally.",
"Q(b) Perform CRUD in MongoDB Compass.\nA: Create database/collection, then insert, read, update, and delete documents using Compass UI.",
"Q(c) Connect Node.js with MongoDB using Mongoose.\nA: Install `mongoose`, connect with connection URI, define schema/model, and test query."
]],
["Practical 8 – API Creation and Integration","Build and validate REST APIs with Mongoose + Express.",[
"Q(a) Create MongoDB schema and model.\nA: Define `mongoose.Schema({...})` and export model for collection operations.",
"Q(b) Implement REST API operations.\nA: Add Create, Read, Update, Delete endpoints using Express and Mongoose methods.",
"Q(c) Test REST APIs in Postman.\nA: Send GET/POST/PUT/DELETE requests and verify status codes plus JSON responses."
]],
["Practical 9 – Frontend and Backend Integration","Connect React frontend to Express backend using Axios.",[
"Q(a) Create React frontend and connect to Express API.\nA: Configure backend URL and call APIs from React using Axios.",
"Q(b) Retrieve and display student records.\nA: Fetch list from API and render records in a table/list component.",
"Q(c) Add, update, and delete student records.\nA: Implement form + edit + delete actions that call POST/PUT/DELETE and refresh UI."
]],
["Practical 10 – Complete MERN CRUD Application","Design and execute a full MERN application workflow.",[
"Q(a) Build a complete MERN CRUD app.\nA: Combine React frontend, Node/Express API, and MongoDB database with full Create/Read/Update/Delete flow, validation, and end-to-end testing."
]]
];
const C=[
`// practical1.js
const name="MERN Student", age=20, a=12, b=5;
function display(person, years){ return person+" is "+years+" years old"; }
console.log("Welcome to Node.js");
console.log(display(name, age));
console.log({add:a+b, subtract:a-b, multiply:a*b, divide:a/b, remainder:a%b, power:a**b});
if(age>=18 && name) console.log("Adult student");
else console.log("Minor student");
for(let i=1;i<=5;i++) console.log(\`Value is \${i}\`);`,
`// practical2.js
const students=[{name:"Asha",marks:82},{name:"Ravi",marks:65},{name:"Mina",marks:91}];
const add=(a,b)=>a+b;
const passed=students.filter(s=>s.marks>=70);
const names=students.map(s=>s.name);
const total=students.reduce((sum,s)=>sum+s.marks,0);
students[0].grade="A";
delete students[1].grade;
function result(student){ return {name:student.name, passed:student.marks>=40}; }
console.log({names, passed, average:total/students.length, sample:result(students[0]), sum:add(7,3)});
for(const [key,value] of Object.entries(students[0])) console.log(key,value);`,
`// src/App.jsx
import "./App.css";
const student={name:"Asha",course:"MERN Stack"};
function Sum({a,b}){ return <p>Sum: {a+b}</p>; }
function App(){
  const now=new Date().toLocaleString();
  return <main className="card"><h1>Welcome to MERN Stack Development</h1>
    <p>Student: {student.name}</p><p>Course: {student.course}</p>
    <Sum a={10} b={20}/><p>Current time: {now}</p></main>;
}
export default App;`,
`// src/App.jsx
import {useState} from "react";
function Header({title}){ return <h1>{title}</h1>; }
function App(){
  const [count,setCount]=useState(0);
  const [task,setTask]=useState("");
  const [tasks,setTasks]=useState([]);
  function addTask(e){ e.preventDefault(); if(task.trim()) setTasks([...tasks,task.trim()]); setTask(""); }
  return <main><Header title="Interactive ToDo"/>
    <button onClick={()=>setCount(count+1)}>Count: {count}</button>
    <form onSubmit={addTask}><input value={task} onChange={e=>setTask(e.target.value)}/>
      <button>Add</button></form>
    <ul>{tasks.map((item,index)=><li key={index}>{item}</li>)}</ul>
  </main>;
}
export default App;`,
`// src/App.jsx
import {BrowserRouter,Link,Routes,Route} from "react-router-dom";
import axios from "axios";
import {useEffect,useState} from "react";
function Home(){return <h2>Home</h2>;} function About(){return <h2>About</h2>;}
function Students(){
  const [rows,setRows]=useState([]); const [query,setQuery]=useState("");
  useEffect(()=>{axios.get("https://jsonplaceholder.typicode.com/users").then(r=>setRows(r.data));},[]);
  return <><input placeholder="Search" value={query} onChange={e=>setQuery(e.target.value)}/>
    <ul>{rows.filter(x=>x.name.toLowerCase().includes(query.toLowerCase()))
      .map(x=><li key={x.id}>{x.name} - {x.email}</li>)}</ul></>;
}
export default function App(){return <BrowserRouter><nav><Link to="/">Home</Link> <Link to="/about">About</Link> <Link to="/students">Students</Link></nav>
  <Routes><Route path="/" element={<Home/>}/><Route path="/about" element={<About/>}/><Route path="/students" element={<Students/>}/></Routes></BrowserRouter>;}`,
`// server.js
const express=require("express"); const app=express(); app.use(express.json());
const users=[{id:1,name:"Asha"},{id:2,name:"Ravi"}];
app.get("/",(req,res)=>res.send("<h1>MERN API</h1>"));
app.get("/about",(req,res)=>res.sendFile(__dirname+"/about.html"));
app.get("/api/users",(req,res)=>res.json(users));
app.get("/user/:id",(req,res)=>{const u=users.find(x=>x.id===Number(req.params.id)); res.json(u||{error:"Not found"});});
app.get("/search",(req,res)=>res.json(users.filter(x=>x.name.toLowerCase().includes((req.query.q||"").toLowerCase()))));
app.listen(3000,()=>console.log("http://localhost:3000"));`,
`// connect.js
const mongoose=require("mongoose");
const Student=mongoose.model("Student",new mongoose.Schema({name:String,course:String}));
async function main(){
  await mongoose.connect("mongodb://127.0.0.1:27017/mern_practical");
  await Student.deleteMany({});
  await Student.create({name:"Asha",course:"MERN"});
  console.log(await Student.find());
  await mongoose.disconnect();
}
main().catch(console.error);`,
`// server.js
const express=require("express"); const mongoose=require("mongoose"); const app=express(); app.use(express.json());
mongoose.connect("mongodb://127.0.0.1:27017/mern_practical");
const Student=mongoose.model("Student",new mongoose.Schema({name:{type:String,required:true},course:String},{timestamps:true}));
app.get("/students",async(req,res)=>res.json(await Student.find()));
app.post("/students",async(req,res)=>res.status(201).json(await Student.create(req.body)));
app.put("/students/:id",async(req,res)=>res.json(await Student.findByIdAndUpdate(req.params.id,req.body,{new:true})));
app.delete("/students/:id",async(req,res)=>{await Student.findByIdAndDelete(req.params.id);res.sendStatus(204);});
app.listen(3000,()=>console.log("API running on 3000"));`,
`// src/App.jsx
import axios from "axios"; import {useEffect,useState} from "react";
const api="http://localhost:3000/students";
export default function App(){
  const [students,setStudents]=useState([]); const [form,setForm]=useState({name:"",course:""});
  const load=()=>axios.get(api).then(r=>setStudents(r.data));
  useEffect(load,[]);
  const save=e=>{e.preventDefault(); axios.post(api,form).then(()=>{setForm({name:"",course:""});load();});};
  return <main><h1>Students</h1><form onSubmit={save}><input placeholder="Name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/>
    <input placeholder="Course" value={form.course} onChange={e=>setForm({...form,course:e.target.value})}/><button>Add</button></form>
    <ul>{students.map(s=><li key={s._id}>{s.name} - {s.course}</li>)}</ul></main>;
}`,
`// Complete MERN example: server.js
const express=require("express"),mongoose=require("mongoose"),cors=require("cors");
const app=express(); app.use(cors()); app.use(express.json());
mongoose.connect(process.env.MONGO_URI||"mongodb://127.0.0.1:27017/mern_crud");
const Student=mongoose.model("Student",new mongoose.Schema({name:{type:String,required:true,trim:true},email:{type:String,required:true,unique:true},course:String},{timestamps:true}));
app.get("/api/students",async(req,res)=>res.json(await Student.find().sort({createdAt:-1})));
app.post("/api/students",async(req,res)=>{try{res.status(201).json(await Student.create(req.body));}catch(e){res.status(400).json({error:e.message});}});
app.put("/api/students/:id",async(req,res)=>{try{res.json(await Student.findByIdAndUpdate(req.params.id,req.body,{new:true,runValidators:true}));}catch(e){res.status(400).json({error:e.message});}});
app.delete("/api/students/:id",async(req,res)=>{await Student.findByIdAndDelete(req.params.id);res.sendStatus(204);});
app.listen(3000,()=>console.log("API on http://localhost:3000"));`
];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const cards=[["AEB-1","Create a user registration and login system","Backlog"],["AEB-5","Create Dashboard","Backlog"],["AEB-6","Create User Profile","Backlog"],["AEB-2","Developed Login API","In Progress"],["AEB-3","Login Functionality","In Review"],["AEB-4","Database Setup Completed","In Review"]];
const cols=["Backlog","Selected for development","In Progress","In Review","Done"];
let tab="board",cur=0;
function render(){
 document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t==tab));
 const v=document.getElementById("v");
 if(tab=="board")v.innerHTML='<div class="board">'+cols.map(c=>'<div class="col"><h5>'+c.toUpperCase()+'</h5>'+cards.filter(k=>k[2]==c).map(k=>'<div class="card">'+k[1]+'<br><small>☑ '+k[0]+'</small></div>').join("")+'</div>').join("")+'</div>';
 else if(tab=="sum")v.innerHTML='<div class="stats"><div class="stat"><b>6</b>work items created</div><div class="stat"><b>1</b>in progress</div><div class="stat"><b>2</b>in review</div><div class="stat"><b>0</b>due this week</div></div>';
 else if(tab=="list")v.innerHTML='<table><tr><th>Key</th><th>Work</th><th>Status</th><th>Priority</th></tr>'+cards.map(k=>'<tr><td>'+k[0]+'</td><td>'+k[1]+'</td><td><span class="tag">'+k[2].toUpperCase()+'</span></td><td>'+(k[0]=="AEB-1"?"High":"Medium")+'</td></tr>').join("")+'</table>';
 else if(tab=="cal")v.innerHTML='<p style="color:var(--m)">No work items scheduled this month.</p>';
 else docs();
}
function docs(){
 const all=[];
 let toc='<h6>MERN Stack Practicals</h6>';
 S.forEach((x,pi)=>{
  x[2].forEach((s,qi)=>{
   const question=s.split("\n")[0].replace(/^Q\([^)]+\)\s*/,"");
   all.push({practical:x,question:s,pi,qi});
   const i=all.length-1;
   toc+='<a data-i="'+i+'" class="question '+(i==cur?"on":"")+'">Practical '+(pi+1)+'.'+String.fromCharCode(97+qi)+': '+esc(question)+'</a>';
  });
 });
 const o=all[cur]||all[0];
 const parts=o.question.split("\n");
 let body='<h2>'+o.practical[0]+'</h2><p style="color:var(--m)">Aim: '+o.practical[1]+'</p>';
 body+='<section><h3>'+esc(parts[0])+'</h3><p><b>Complete answer:</b> '+esc(parts.slice(1).join("\n")).replace(/\n/g,"<br>")+'</p>';
 body+='<h3>Full practical code</h3><pre>'+esc(C[o.pi])+'</pre><p><b>Run:</b> Follow the setup in the answer, then run the file using Node.js or start the React app with <code>npm run dev</code>.</p></section>';
 document.getElementById("v").innerHTML='<div class="docs"><div class="toc">'+toc+'</div><div class="doc">'+body+'</div></div>';
 document.querySelectorAll(".toc a").forEach(a=>a.onclick=()=>{cur=+a.dataset.i;docs();scrollTo(0,0)});
}
document.querySelectorAll("#tabs a").forEach(a=>a.onclick=()=>{tab=a.dataset.t;render()});
render();
</script></body></html>
